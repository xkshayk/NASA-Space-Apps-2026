name: Check lunar explorer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: science/requirements.lock
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm install --frozen-lockfile
      - run: python -m pip install -r science/requirements.lock
      - uses: actions/cache@v4
        with:
          path: |
            data/kernels
            data/raw
          key: nasa-inputs-${{ hashFiles('data/downloads.json', 'data/regions.json') }}
      - run: python science/download_data.py
      # 20 m regional tiles near IM-1/IM-2; the engine and science tests require them.
      - run: python science/import_regions.py
      - run: python science/prepare_assets.py
      - run: node scripts/check.mjs
      - run: python -m pytest science -q
      - run: node scripts/build.mjs
